<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>EDP4E Chatbot</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <style>
      /* Integrated QR specific styles */
      .qr-container {
          text-align: center;
          padding: 10px;
          background: #fff;
          border-radius: 10px;
          color: #333;
      }
      .qr-code-img {
          display: block;
          margin: 10px auto;
          max-width: 150px;
          border: 2px solid #eee;
          border-radius: 5px;
      }
      .qr-link {
          display: inline-block;
          margin-top: 5px;
          font-size: 0.8rem;
          color: #007bff;
          text-decoration: underline;
      }
  </style>
</head>
<body>
  <div class="container">
    <h1>EDP4E Chatbot - Knowledge Graph Query Assistant</h1>

    <div id="chatbot-interface"></div>

    <form id="form">
      <textarea id="question" name="question" placeholder="Ask about shortages or anything about Battery"></textarea>
      <button type="submit">Send Query</button>
    </form>

    <div class="technical-details">
        <h3>Technical Details</h3>
        <div class="result-container">
            
            <div class="result-col">
                <div class="code-header">
                    <h4>Generated SPARQL</h4>
                    <button type="button" class="copy-btn" onclick="copyCode('sparql', this)">Copy</button>
                </div>
                <pre id="sparql">Awaiting query...</pre>
            </div>
            
            <div class="result-col">
                <div class="code-header">
                    <h4>Fuseki Results (JSON)</h4>
                    <button type="button" class="copy-btn" onclick="copyCode('results', this)">Copy</button>
                </div>
                <pre id="results">Query results will appear here...</pre>
            </div>
        </div>
    </div>
  </div>

<script>
// =========================================================
// JAVASCRIPT FUNCTIONS AND EVENT LISTENERS
// =========================================================

const SPARQL_DEFAULT_TEXT = 'Awaiting query...';
const RESULTS_DEFAULT_TEXT = 'Query results will appear here...';
const textarea = document.getElementById('question');
const defaultHeight = 45; 

const LOADER_HTML = `
    <div class="loader-dots">
        <span></span>
        <span></span>
        <span></span>
    </div>
`;
const PRE_PLACEHOLDER_HTML = `
    <div class="pre-placeholder">
        ${LOADER_HTML}
    </div>
`;

// --- 1. Copy to Clipboard Functionality ---
function copyCode(elementId, buttonElement) {
    const codeElement = document.getElementById(elementId);
    let textToCopy = codeElement.textContent;
    
    if (elementId.startsWith('error-text-')) {
        textToCopy = codeElement.getAttribute('data-raw-text').trim(); 
    }

    navigator.clipboard.writeText(textToCopy)
        .then(() => {
            const originalText = buttonElement.textContent;
            buttonElement.textContent = 'Copied!';
            setTimeout(() => { buttonElement.textContent = originalText; }, 1500);
        })
        .catch(err => {
            console.error('Could not copy text: ', err);
        });
}

// --- 2. Dynamic Textarea Height ---
textarea.addEventListener('input', () => {
    textarea.style.height = 'auto';
    if (textarea.scrollHeight > defaultHeight) { 
        let newHeight = Math.min(textarea.scrollHeight, 200); 
        textarea.style.height = newHeight + 'px';
    } else {
        textarea.style.height = defaultHeight + 'px';
    }
});

// --- 2b. Trigger form submit on Enter key ---
textarea.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        document.getElementById('form').dispatchEvent(new Event('submit'));
    }
});



// --- 3. Chat Message Handling ---
let errorIdCounter = 0; 

function addMessage(text, sender, isError = false, rawText = null) {
    const chatInterface = document.getElementById('chatbot-interface');
    const msgDiv = document.createElement('div');
    msgDiv.className = `chat-bubble ${sender} ${isError ? 'error' : ''}`;
    
    if (isError) {
        errorIdCounter++;
        const uniqueId = `error-text-${errorIdCounter}`;
        const escapedRawText = rawText ? rawText.replace(/"/g, '&quot;') : 'No detailed error provided.';
        
        msgDiv.innerHTML = `
            <div id="${uniqueId}" class="error-text" data-raw-text="${escapedRawText}">${text}</div>
            <button class="copy-error-btn" onclick="copyCode('${uniqueId}', this)">Copy Error</button>
        `;
    } else {
        msgDiv.innerHTML = text;
    }
    
    chatInterface.appendChild(msgDiv);
    chatInterface.scrollTop = chatInterface.scrollHeight; 
}

// --- 4. Form Submission (AJAX Query) ---
document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const questionText = textarea.value.trim();
    const sparqlElement = document.getElementById('sparql');
    const resultsElement = document.getElementById('results');

    if (!questionText) return;

    textarea.style.height = defaultHeight + 'px';
    addMessage(questionText, 'user');
    textarea.value = ''; 

    addMessage(LOADER_HTML, 'system-status');
    const thinkingMessage = document.querySelector('.system-status:last-child'); 

    sparqlElement.innerHTML = PRE_PLACEHOLDER_HTML;
    resultsElement.innerHTML = PRE_PLACEHOLDER_HTML;

    try {
        const resp = await fetch('/query', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({question: questionText})
        });
        
        if (thinkingMessage) thinkingMessage.remove(); 

        let data = await resp.json();

        if (!resp.ok) {
            let rawErrorText = `Error: ${data.error || 'Unknown server error.'}\n\nAttempted SPARQL:\n${data.sparql || 'N/A'}`;
            addMessage(`❌ Error: ${data.error || 'Unknown error.'}`, 'system', true, rawErrorText);
            sparqlElement.textContent = data.sparql || 'N/A';
            resultsElement.textContent = 'Execution Failed.';
            return;
        }

        // Handle QR Code Response (Excel Strategy)
        // Inside the document.getElementById('form').addEventListener...
        if (data.type === 'qr') {
            const qrHtml = `
                <div class="qr-container">
                    <strong>${data.message}</strong><br>
                    <img src="${data.qr_url}" class="qr-code-img" alt="QR Code">
                    <a href="${data.target_url}" target="_blank" class="qr-link">Click This Link</a>
                </div>
            `;
            addMessage(qrHtml, 'system');
            
            // Improved placeholder text for the technical box
            sparqlElement.innerHTML = `<span style="color: #666; font-style: italic;">No SPARQL generated </span>`;
            resultsElement.textContent = JSON.stringify(data.results, null, 2);
        }
        // Handle Standard SPARQL Response
        else {
            const resultCount = data.results.results.bindings ? data.results.results.bindings.length : 0;
            addMessage(`✅ Success! Found **${resultCount}** results.<br>
                        *See Technical Details below for query and JSON.*`, 'system');
            sparqlElement.textContent = data.sparql;
            resultsElement.textContent = JSON.stringify(data.results, null, 2);
        }

    } catch (e) {
        if (thinkingMessage) thinkingMessage.remove(); 
        addMessage(`❌ Network error at client-side.`, 'system', true, e.message);
        sparqlElement.textContent = SPARQL_DEFAULT_TEXT;
        resultsElement.textContent = RESULTS_DEFAULT_TEXT;
    }
});

window.onload = function() {
    addMessage("Hello! Ask the query that you want to find!!", 'system');
};
</script>
</body>
</html>
